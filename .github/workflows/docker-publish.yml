name: Publish Docker image and release

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sessyweb

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The version lives in one place and is bumped on every change, so it is
      # the natural tag for the image.
      - name: Read version from AppInfo.cs
        id: version
        run: |
          VERSION=$(sed -n 's/.*Version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' SessyCommon/AppInfo.cs)
          if [ -z "$VERSION" ]; then
            echo "Could not read the version from SessyCommon/AppInfo.cs" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION}"

      - name: Lowercase the image name
        id: image
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: SessyWeb/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.image.outputs.name }}:latest\`" >> "$GITHUB_STEP_SUMMARY"

  # A GitHub release is created only after the image is published, so a version
  # never gets a release/tag whose image failed to build. Idempotent: it skips
  # when the release already exists, so only a version bump produces a release.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version from AppInfo.cs
        id: version
        run: |
          VERSION=$(sed -n 's/.*Version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' SessyCommon/AppInfo.cs)
          if [ -z "$VERSION" ]; then
            echo "Could not read the version from SessyCommon/AppInfo.cs" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Skip if the release already exists
        id: exists
        run: |
          if gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.version }} already exists - skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Pull just this version's section out of the changelog for the release body.
      - name: Extract the changelog section for this version
        if: steps.exists.outputs.skip == 'false'
        run: |
          VER="${{ steps.version.outputs.version }}"
          awk -v v="## [$VER]" 'index($0, v)==1 {g=1; next} g && /^## \[/ {exit} g {print}' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "See CHANGELOG.md for details." > NOTES.md
          fi

      - name: Create the release
        if: steps.exists.outputs.skip == 'false'
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file NOTES.md \
            --target master
